name: Repository checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan working files and all fetched history
        run: |
          gitleaks dir --redact .
          gitleaks git --redact --log-opts='--all' .
      - name: Verify context and source text
        run: |
          ./scripts/wiki-lint.sh
          python3 scripts/verify_linkedin_context.py
          python3 scripts/verify_youtube_context.py
          python3 scripts/import_rb2b_linkedin.py --check
